<!DOCTYPE html>
<html>
<head>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0f0f2b, #000);
  color:white;
  text-align:center;

/* PARTICLE BACKGROUND */
#bg{
  position:fixed;
  top:0;
  left:0;

}

/* HEADER */
.header{
  margin-top:40px;
  font-size:40px;
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(90deg,gold,orange,white);
  -webkit-background-clip:text;

  text-shadow:0 0 25px gold;
}

.sub{
  color:cyan;
  margin-bottom:30px;
  text-shadow:0 0 10px cyan;
}

/* CARD CONTAINER */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
  padding:20px;
}

/* CARD */
.card{
  position:relative;
  width:280px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  box-shadow:0 0 30px rgba(255,215,0,0.5);
  transition:0.4s;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:20px;
  padding:2px;
  background:linear-gradient(45deg,gold,magenta,cyan,gold);
  background-size:300%;
  animation:borderMove 6s linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
}

@keyframes borderMove{
  0%{background-position:0%}
  100%{background-position:300%}
}

.card:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 0 50px gold;
}

.price{
  font-size:26px;
  font-weight:bold;
  color:gold;
  text-shadow:0 0 15px gold;
  margin:10px 0;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,gold,orange);
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px gold;
}

/* TELEGRAM BUTTON */

  bottom:20px;

  height:60px;
  background:#0088cc;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 20px rgba(0,136,204,0.7);
}

.telegram-float img{
  width:30px;
}

.footer{
  margin:40px 0;
  color:gray;
}

<!-- PARTICLE SCRIPT -->
<script>
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let particles=[];
for(let i=0;i<120;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*2,
    speed:Math.random()*0.5+0.2
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(255,215,0,0.8)";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
    p.y+=p.speed;
    if(p.y>canvas.height) p.y=0;
  });
  requestAnimationFrame(draw);
}
draw();
</script>

}
</script>
